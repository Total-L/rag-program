# ─────────────────────────────────────────────────────────────
# Prometheus — rag_program（C5）
#
# Scrape：
#   1) rag-api (P1 FastAPI) — /v1/metrics 端点（S2/M1 已暴露）
#   2) otel-collector       — OTel 转出的 Prometheus metrics
#   3) prometheus 自身     — 自监控
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: rag-program-dev

scrape_configs:
  # ── P1 API server（Prometheus 端点）──
  - job_name: rag-api
    metrics_path: /v1/metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: rag-program
          component: api

  # ── OpenTelemetry Collector（OTLP → Prom）──
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: rag-program
          component: otel

  # ── Prometheus 自监控 ──
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ── Postgres exporter（生产建议；C5 MVP 先不接）──
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # ── Ollama exporter（暂无官方 exporter；用 OTel 即可）──
  # - job_name: ollama
  #   static_configs:
  #     - targets: ["ollama:11434"]