apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-program.fullname" . }}-config
  labels:
    {{- include "rag-program.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if .Values.otel.enabled }}
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.endpoint | quote }}
  {{- else }}
  OTEL_ENABLED: "false"
  {{- end }}