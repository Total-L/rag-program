apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-program.fullname" . }}
  labels:
    {{- include "rag-program.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rag-program.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # 让 prometheus 发现这个 pod
        prometheus.io/scrape: {{ .Values.podAnnotations.prometheus.io/scrape | default "true" | quote }}
        prometheus.io/port: {{ .Values.podAnnotations.prometheus.io/port | default "8080" | quote }}
        prometheus.io/path: {{ .Values.podAnnotations.prometheus.io/path | default "/metrics" | quote }}
        # checksum 触发 ConfigMap / Secret 重载
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "rag-program.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rag-program.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rag-program.fullname" . }}-config
            - secretRef:
                name: {{ include "rag-program.fullname" . }}-secret
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.healthcheck.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.healthcheck.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: audit
              mountPath: {{ .Values.config.RAG_PROG_AUDIT_DIR }}
            - name: data
              mountPath: {{ .Values.config.RAG_PROG_DATA_DIR }}
            {{- end }}
            # readOnlyRootFilesystem=true → /tmp 必须挂 emptyDir 写
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: audit
          persistentVolumeClaim:
            claimName: {{ include "rag-program.fullname" . }}-audit
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rag-program.fullname" . }}-data
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}