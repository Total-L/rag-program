# ─────────────────────────────────────────────────────────────
# rag_program — local dev / staging stack（C5）
#
# 跑：docker compose up -d
# 停：docker compose down
# 重建：docker compose build api
#
# 设计取舍（per CLAUDE.md "Simplicity First"）：
#   - dev 默认无鉴权（API_KEY 空）；staging 改 .env 注入
#   - 7 服务都开健康检查；depends_on 用 service_healthy 避免冷启动 race
#   - 数据卷命名清晰（postgres_data / minio_data / rag_data / ollama_data）
#   - 不做 K8s 部署版本（生产留给 helm/kustomize，本文件只覆盖 dev/staging）
# ─────────────────────────────────────────────────────────────

services:

  # ── 1. P1 API 服务（主入口）──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-program:dev
    container_name: rag-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      RAG_PROG_API_KEY: "${RAG_PROG_API_KEY:-}"        # 空 = 鉴权 disabled（dev）
      RAG_PROG_API_PORT: "8080"
      AUDIT_DIR: /app/data/audit
      O6_PG_DSN: "postgresql://rag:rag@postgres:5432/rag"
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_LLM_MODEL: "llama3.2:1b"
      P1_PG_DSN: "postgresql://rag:rag@postgres:5432/rag"
    volumes:
      - rag_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      otel-collector:
        condition: service_started
    networks: [ragnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── 2. Postgres + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"           # 暴露给 host（dev 用 psql 连接）
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [ragnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Ollama（embedding + LLM）──
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks: [ragnet]
    # 启动期预拉模型（避免冷启动 N+1 延迟）
    # 注：dev 环境可注释；CI 不需要 ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── 4. MinIO（S3 兼容 — 用于 P6 connector 测试）──
  minio:
    image: minio/minio:latest
    container_name: rag-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"           # S3 API
      - "9001:9001"           # Web console
    volumes:
      - minio_data:/data
    networks: [ragnet]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 5. OpenTelemetry Collector（OTLP → Prometheus + 远端）──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: rag-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"           # OTLP gRPC
      - "4318:4318"           # OTLP HTTP
      - "8889:8889"           # Prometheus exporter
    networks: [ragnet]
    depends_on:
      prometheus:
        condition: service_started

  # ── 6. Prometheus（scrape api + otel-collector）──
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: rag-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks: [ragnet]

  # ── 7. Grafana（仪表板）──
  grafana:
    image: grafana/grafana:10.4.2
    container_name: rag-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [ragnet]
    depends_on:
      prometheus:
        condition: service_started

# ── 网络 / 卷 ──
networks:
  ragnet:
    driver: bridge

volumes:
  rag_data:
  postgres_data:
  ollama_data:
  minio_data:
  prometheus_data:
  grafana_data: